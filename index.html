<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地理段考闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 插畫風象牙紙＋古金線框；一次一張卡，標題旁與過關畫面放插畫。刻意採單一淺色風格 */
:root{
  --bg:#f3eee6; --card:#fbf8f3; --ink:#3b3029; --soft:#7d6f63; --line:#d9cbb6;
  --accent:#9a7a3e; --accent-deep:#6e5426; --accent-ink:#fffaf0; --hl:#efe0bc; --hl-ink:#4a3712;
  --night:#2b2420;
  --ok:#55704a; --ok-bg:#e9eedf; --ng:#9b4a3d; --ng-bg:#f4e3dc;
  --a:#6e5426; --a-bg:#efe5d3; --b:#5b5560; --b-bg:#e8e3e6;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.7;
  background-image:radial-gradient(ellipse at 50% 0%,#fffdf8 0%,var(--bg) 60%)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:16px}
.portrait{flex:0 0 auto;width:112px;aspect-ratio:3/4;max-width:100%;border-radius:56px 56px 10px 10px;overflow:hidden;
  border:2px solid var(--accent);box-shadow:0 0 0 4px var(--card),0 0 0 5px var(--line),0 8px 18px rgba(80,60,30,.18)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.htext{min-width:0;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--display);font-size:.8rem;letter-spacing:.3em;color:var(--accent)}
header h1{font-family:var(--display);font-size:1.6rem;font-weight:900;margin:0;line-height:1.3;text-wrap:balance}
header p{margin:0;color:var(--soft);font-size:.9rem}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stop{border:1.5px solid var(--line);background:var(--card);color:var(--soft);border-radius:10px;padding:6px 2px;font:inherit;font-size:.75rem;line-height:1.3;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.stop b{font-family:var(--display);font-size:1.1rem;color:var(--ink)}
.stop.on{border-color:var(--accent-deep);background:var(--night);color:var(--hl)}
.stop.on b{color:var(--hl)}
.stop.done:not(.on){border-color:var(--accent)}
.stop.done:not(.on) b::after{content:" ✦";color:var(--accent)}
.stop:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-7px;border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;min-height:300px;box-shadow:0 6px 20px rgba(80,60,30,.08)}
.tag{font-family:var(--display);font-size:.8rem;letter-spacing:.15em;color:var(--accent)}
.card h2{font-family:var(--display);font-size:1.45rem;font-weight:900;margin:0;line-height:1.4;text-wrap:balance}
.card p{margin:0}
.big{font-size:1.15rem}
mark{background:var(--hl);color:var(--hl-ink);padding:0 4px;border-radius:4px;font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.side.a{background:var(--a-bg)} .side.b{background:var(--b-bg)}
.side h3{margin:0;font-family:var(--display);font-size:1.15rem}
.side.a h3{color:var(--a)} .side.b h3{color:var(--b)}
.side p{font-size:.95rem}
.chain{display:flex;flex-direction:column;gap:6px}
.chain div{background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:700}
.chain span{text-align:center;color:var(--accent);font-weight:900}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
.opt[disabled]{cursor:default}
.two{flex-direction:row}
.two .opt{flex:1;text-align:center;font-weight:700}
.two .opt.pa{color:var(--a)} .two .opt.pb{color:var(--b)}
.fb{border-radius:10px;padding:12px 14px;font-size:1rem}
.fb.ok{background:var(--ok-bg)} .fb.ng{background:var(--ng-bg)}
.fb b{display:block;margin-bottom:2px}
.ok-t{color:var(--ok)} .ng-t{color:var(--ng)}
.nav{display:flex;gap:10px;justify-content:space-between}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 20px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn.go{background:var(--night);border-color:var(--night);color:var(--hl);flex:1}
.btn[disabled]{opacity:.4;cursor:default}
.slider{display:flex;flex-direction:column;gap:10px}
.slider input{width:100%;accent-color:var(--accent)}
.km{font-family:var(--display);font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;color:var(--soft);transition:all .2s}
.mode b{display:block;font-size:1.1rem}
.mode.win{border-color:var(--night);background:var(--night);color:var(--hl)}
.tip{border-left:4px solid var(--accent);background:var(--bg);padding:10px 12px;border-radius:0 10px 10px 0;font-size:1rem}
.win-art{align-self:center;width:min(240px,100%);aspect-ratio:3/4;border-radius:120px 120px 14px 14px;overflow:hidden;
  border:2px solid var(--accent);box-shadow:0 0 0 6px var(--card),0 0 0 7px var(--line),0 10px 28px rgba(80,60,30,.22);animation:rise .6s ease-out}
.win-art img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.endbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.score{font-family:var(--display);font-size:3rem;font-weight:900;color:var(--accent-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.small{font-size:.9rem;color:var(--soft)}
.chtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chtab{font:inherit;font-family:var(--display);font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--soft);border-radius:10px;padding:8px 6px;cursor:pointer;line-height:1.35}
.chtab small{display:block;font-family:var(--font);font-weight:400;font-size:.75rem}
.chtab.on{border-color:var(--accent);color:var(--accent-deep);background:var(--hl)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:4.5em 1fr auto;align-items:center;gap:8px;font-size:.95rem}
.brow i{display:block;height:14px;border-radius:7px;background:var(--line)}
.brow.hot i{background:var(--accent)}
.brow em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.model{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.model svg{width:100%;max-width:150px;height:auto}
.model b{font-family:var(--display)}
.model p{font-size:.85rem;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.lot{position:relative;height:230px;border-bottom:6px solid var(--accent-deep);background:linear-gradient(var(--card),var(--bg));border-radius:10px 10px 0 0;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.bld{display:flex;flex-direction:column-reverse;transition:width .25s}
.bld div{border:1px solid var(--card);background:var(--night);min-height:4px}
.bld div:nth-child(odd){background:#4a3f37}
.floorout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.floorout div{background:var(--bg);border-radius:10px;padding:8px 4px}
.floorout b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.rng{display:flex;flex-direction:column;gap:2px}
.rng label{font-weight:700}
.rng input{width:100%;accent-color:var(--accent)}
@media (max-width:420px){.models{grid-template-columns:1fr}.model svg{max-width:130px}}
@keyframes rise{from{transform:translateY(10px) scale(.97)}to{transform:none}}
@media (max-width:420px){.pair{grid-template-columns:1fr}.stop{font-size:.65rem}.portrait{width:88px}header h1{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

{ ch:3, name:"都市化", cards:[
  {t:"learn", h:"三個長得很像的詞", html:`
   <div class="tip"><b>都市化</b>：人<b>從鄉村搬進都市</b>，住在都市的人「比例」變高。</div>
   <div class="tip"><b>都市成長</b>：都市人口變多，但只是<b>跟著全國一起長</b>，比例沒變高。</div>
   <div class="tip"><b>假性都市化</b>：鄉村沒工作、活不下去，人被<b>「推」</b>進都市，都市卻沒有足夠工作和住宅。常見於中南美洲、開發中國家。</div>
   <p class="big">判斷法：<mark>都市長得比全國快 → 都市化</mark>；長得一樣或更慢 → 只有都市成長。</p>`},
  {t:"learn", h:"算一次就會（第 4 題）", html:`
   <p>成長率＝（2019 − 2009）÷ 2009</p>

    <div class="brow"><span>西寧</span><i style="width:9.6%"></i><em>4.8%</em></div>
   </div>
   <p>河內、峴港比全國快 → <mark>都市化</mark>。海防、西寧比全國慢 → 只有<b>都市成長</b>，而且人口增加主要靠自然增加（生小孩）。</p>
   <div class="tip">答案 (D) 乙丙。</div>`},
  {t:"quiz", q:"巴西把首都遷到巴西利亞，大量公務員和家屬搬進去，人口從 50 萬變 300 萬。這是？", o:["都市化","郊區化","工業化","都市成長"], a:0, why:"人大量移入都市（社會增加），就是都市化。（第 1 題）"},

  {t:"quiz", q:"哥倫比亞農村長年動亂，人大量湧入首都波哥大，形成大片貧民窟。哪組對？（甲）二三級產業快速發展，人口集中都市（乙）波哥大人口成長率大於全國（丙）有快速都市化（丁）波哥大出生率高於全國", o:["甲乙","乙丁","乙丙","丙丁"], a:2, why:"人是被農村動亂「推」進城的，不是產業發展吸引，所以甲錯（這是假性都市化）。題文只看得出移入人口多，看不出出生率，丁不能判斷。（第 23 題）"},
]},
{ ch:3, name:"擴張郊區", cards:[
  {t:"learn", h:"都市變大的兩種說法", html:`
   <div class="pair">

   </div>
   <div class="tip">看到「沿道路往鄉村延伸、低密度」→ 郊區化。看到「重劃區、購物商場、範圍擴大」→ 都市擴張。</div>`},
  {t:"quiz", q:"居民沿主要道路往外搬到鄉村，形成低密度的都市土地使用區，這叫？", o:["郊區化","假性都市化","都市成長","都市內部結構"], a:0, why:"「沿道路往外」「低密度」是郊區化的關鍵字。（第 2 題）"},
  {t:"quiz", q:"臺中市區往七期、十四期、水湳延伸，出現重劃區和購物商場。這是？", o:["都市成長","都市擴張","都市機能","扇形都市"], a:1, why:"範圍變大、新區塊長出來＝都市擴張。（第 5 題）"},

const KEY="geo-ch2-quest";
let st={lv:0,i:0,done:{},ans:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.ans) st=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

const lvNo=()=>LEVELS.slice(0,st.lv).filter(x=>(x.ch||2)===(LEVELS[st.lv].ch||2)).length+1;
const $=id=>document.getElementById(id);
const card=$("card");
const total=LEVELS.reduce((n,l)=>n+l.cards.length+1,0);

const CH={2:"聚落、交通與中地",3:"都市與城鄉關係"};
function drawMap(){
  const ch=LEVELS[st.lv].ch||2;
  $("h1").textContent=CH[ch]; $("eyebrow").textContent="地理 第"+(ch===2?"二":"三")+"章";
  $("chtabs").innerHTML=[2,3].map(c=>{const first=LEVELS.findIndex(l=>(l.ch||2)===c);const n=LEVELS.filter((l,k)=>(l.ch||2)===c&&st.done[k]).length;return `<button type="button" role="tab" aria-selected="${c===ch}" class="chtab ${c===ch?"on":""}" data-f="${first}">第 ${c} 章<small>${CH[c]}・${n}/6 關</small></button>`}).join("");
  $("chtabs").querySelectorAll(".chtab").forEach(b=>b.onclick=()=>{st.lv=+b.dataset.f;st.i=0;render();});
  $("map").innerHTML=LEVELS.map((l,k)=>(l.ch||2)!==ch?"":`<button type="button" class="stop ${k===st.lv?"on":""} ${st.done[k]?"done":""}" data-k="${k}"><b>${LEVELS.slice(0,k).filter(x=>(x.ch||2)===ch).length+1}</b>${l.name}</button>`).join("");
  $("map").querySelectorAll(".stop").forEach(b=>b.onclick=()=>{st.lv=+b.dataset.k;st.i=0;render();});
  let pos=0; for(let k=0;k<st.lv;k++) pos+=LEVELS[k].cards.length+1; pos+=st.i+1;
  $("bar").style.width=(pos/total*100)+"%";
}

function quizHTML(c,key,labels){
  const picked=st.ans[key];
  const isTwo=c.t==="two";
  const opts=isTwo?(c.L||["地點","位置"]):c.o;
  let html=`<div class="tag">第 ${lvNo()} 關・答題</div><h2>${c.q}</h2><div class="opts ${isTwo?"two":""}">`;
  opts.forEach((o,j)=>{
    let cls=isTwo?(j===0?"pa":"pb"):"";
    if(picked!==undefined){ if(j===c.a) cls+=" right"; else if(j===picked) cls+=" wrong"; }
    html+=`<button type="button" class="opt ${cls}" data-j="${j}" ${picked!==undefined?"disabled":""}>${o}</button>`;
  });
  html+="</div>";
  if(picked!==undefined){
    const ok=picked===c.a;
    html+=`<div class="fb ${ok?"ok":"ng"}"><b class="${ok?"ok-t":"ng-t"}">${ok?"答對了！":"答案是「"+opts[c.a]+"」"}</b>${c.why}</div>`;
  }
  return html;
}

  return `<div class="tag">第 ${lvNo()} 關・動手試</div><h2>${c.h}</h2>
  <div class="slider"><div class="km"><span id="kmv">300</span> 公里</div>
  <input type="range" id="km" min="0" max="900" step="10" value="300" aria-label="運輸距離（公里）">

  <div class="tip">口訣：<b>短程公路、中程鐵路、長程水運</b></div>`;

function bindSlider(){
  const r=$("km"); const f=()=>{const v=+r.value;$("kmv").textContent=v;const w=v<80?0:v<550?1:2;[0,1,2].forEach(k=>$("m"+k).classList.toggle("win",k===w));};
  r.oninput=f; f();
}

   <rect x="14" y="76" width="30" height="20" rx="4" fill="${C[1]}"/><rect x="92" y="56" width="18" height="16" rx="4" fill="${C[2]}"/></svg>`;
  return `<div class="tag">第 ${lvNo()} 關・觀念</div><h2>三種都市結構，看圖記</h2>
  <div class="models">

   <div class="model">${sec}<b>扇形</b><p>沿交通線長成一片片扇形，工業沿鐵路</p></div>

  </div>

  <div class="tip">口訣：<b>同心一圈圈、扇形沿線走、多核好多頭。</b></div>`;
}
function floorHTML(c){
  return `<div class="tag">動手試</div><h2>${c.h}</h2>
  <div class="lot"><div class="bld" id="bld"></div></div>
  <div class="rng"><label for="cov">建蔽率 <span id="covv"></span>%</label><input type="range" id="cov" min="10" max="100" step="10" value="60"></div>
  <div class="rng"><label for="far">容積率 <span id="farv"></span>%</label><input type="range" id="far" min="100" max="1200" step="20" value="600"></div>
  <div class="floorout"><div>腳印<b id="o1"></b></div><div>可蓋層數<b id="o2"></b></div><div>空地<b id="o3"></b></div></div>
  <div class="presets"><button type="button" data-c="90" data-f="360">舊公寓 90%／360%</button><button type="button" data-c="60" data-f="600">新大樓 60%／600%</button><button type="button" data-c="20" data-f="1200">鉛筆樓 20%／1200%</button></div>
  <div class="tip">層數 ＝ 容積率 ÷ 建蔽率。容積率固定時，腳印越小，大樓越高、空地越多。</div>`;
}
function bindFloor(){
  const cov=$("cov"),far=$("far");
  const f=()=>{const c=+cov.value,F=+far.value,n=Math.max(1,Math.floor(F/c));

  <p>${ok===q?"全對，這關穩了。":"錯的題目可以按「重玩這關」再試一次。"}</p>
  <button type="button" class="btn" id="redo">重玩這關</button>
  <p class="small">${last?"兩章十二關全部完成！考前再從第一關快速刷一次。":"按「下一張」進入下一關。"}</p></div>`;}

function render(){
  const L=LEVELS[st.lv]; const n=L.cards.length;
  if(st.i>=n){ card.innerHTML=endHTML(); $("redo").onclick=()=>{L.cards.forEach((c,j)=>delete st.ans[st.lv+"-"+j]);st.i=0;render();}; }
  else{
    const c=L.cards[st.i], key=st.lv+"-"+st.i;
    if(c.t==="learn") card.innerHTML=`<div class="tag">第 ${lvNo()} 關・觀念</div><h2>${c.h}</h2>${c.html}`;
    else if(c.t==="slider"){ card.innerHTML=sliderHTML(c); bindSlider(); }
    else if(c.t==="models"){ card.innerHTML=modelsHTML(); }
    else if(c.t==="floor"){ card.innerHTML=floorHTML(c); bindFloor(); }
    else{
      card.innerHTML=quizHTML(c,key);
      card.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{st.ans[key]=+b.dataset.j;save();render();});
    }
  }
  const atEnd=st.i>=n, isQ=!atEnd&&["quiz","two"].includes(L.cards[st.i].t), unanswered=isQ&&st.ans[st.lv+"-"+st.i]===undefined;
  $("next").disabled=unanswered||(atEnd&&st.lv===LEVELS.length-1);
  $("next").textContent=unanswered?"先選一個答案":"下一張";
  $("prev").disabled=st.lv===0&&st.i===0;
  drawMap(); save();
}
$("next").onclick=()=>{const n=LEVELS[st.lv].cards.length; if(st.i<n) st.i++; else if(st.lv<LEVELS.length-1){st.lv++;st.i=0;} render(); window.scrollTo({top:0});};
$("prev").onclick=()=>{ if(st.i>0) st.i--; else if(st.lv>0){st.lv--;st.i=LEVELS[st.lv].cards.length;} render(); };
render();
</script>

</body>
</html>
